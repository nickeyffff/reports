const v = document.getElementById('v');
const list = document.getElementById('list');
const elTitle = document.getElementById('title');
const elMeta = document.getElementById('meta');
const elDl = document.getElementById('dl');
const elOpen = document.getElementById('open');
const toast = document.getElementById('toast');

function say(msg){
  toast.textContent = msg;
  toast.classList.add('on');
  clearTimeout(say._t);
  say._t = setTimeout(()=>toast.classList.remove('on'), 1600);
}

DATA.forEach((c, i)=>{
  const li = document.createElement('li');
  li.dataset.i = i;
  li.innerHTML =
    '<img class="thumb" alt="" loading="lazy" src="' + c.thumb + '">' +
    '<div class="txt">' +
      '<div class="nm">' + c.name + '</div>' +
      '<div class="mt"><span class="no">' + c.num + '</span> · ' + c.dur + ' · ' + c.size + '</div>' +
    '</div>';
  li.addEventListener('click', ()=>select(i, true));
  list.appendChild(li);
});

function select(i, fromClick){
  if (!DATA[i]) i = 0;
  const c = DATA[i];
  [...list.children].forEach((li, k)=>li.classList.toggle('on', k === i));

  if (v.getAttribute('data-cur') !== String(i)){
    v.setAttribute('data-cur', i);
    v.setAttribute('poster', c.thumb);
    v.setAttribute('src', c.play);
    v.load();
  }
  elTitle.textContent = c.num + '. ' + c.name;
  elMeta.innerHTML = '<span>时长 ' + c.dur + '</span><i>|</i><span>体积 ' + c.size +
                     '</span><i>|</i><span>2560×1440 · H.264 + AAC</span>';
  elDl.href = c.dl;
  elDl.setAttribute('download', c.num + ' ' + c.name + '.mp4');
  elOpen.href = c.play;
  document.title = c.num + ' ' + c.name + ' · 大讲堂课程录屏';
  if (fromClick && location.hash !== '#' + c.num) history.replaceState(null, '', '#' + c.num);
}

document.getElementById('copy').addEventListener('click', async ()=>{
  const i = Number(v.getAttribute('data-cur') || 0);
  const url = location.origin + location.pathname + '#' + DATA[i].num;
  try { await navigator.clipboard.writeText(url); say('已复制播放页链接'); }
  catch(e){
    const t = document.createElement('textarea');
    t.value = url; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); say('已复制播放页链接'); }
    catch(_){ say(url); }
    t.remove();
  }
});

const start = ()=> {
  const n = (location.hash || '').replace('#', '');
  const i = DATA.findIndex(c => c.num === n);
  select(i >= 0 ? i : 0, false);
};
window.addEventListener('hashchange', start);
start();
</script>
